<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль | S84.TODO</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #575757;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            min-height: 100vh;
        }
        
        .container {
            display: flex;
            min-height: 100vh;
        }
        
        /* Левая панель с иконками */
        .sidebar {
            width: 60px;
            background: #575757;
            border-right: 1px solid #888888;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
        }
        
        .nav-icon {
            width: 40px;
            height: 40px;
            background: #888888;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: background 0.3s;
            color: white;
            font-size: 20px;
            text-decoration: none;
        }
        
        .nav-icon:hover {
            background: #F6A103;
        }
        
        .nav-icon.active {
            background: #F6A103;
        }
        
        /* Основной контент */
        .main-content {
            flex: 1;
            padding: 40px;
            max-width: 600px;
        }
        
        .back-btn {
            margin-bottom: 30px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #F6A103;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
        }
        
        .back-btn:hover {
            text-decoration: underline;
        }
        
        .profile-header {
            margin-bottom: 40px;
        }
        
        .logo {
            font-size: 32px;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
        }
        
        .logo span {
            color: #F6A103;
        }
        
        .profile-title {
            font-size: 24px;
            color: #F6A103;
            margin-bottom: 20px;
        }
        
        .profile-content {
            background: #D9D9D9;
            border-radius: 12px;
            padding: 30px;
            color: #575757;
        }
        
        .profile-info {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .profile-avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #F6A103 0%, #e59200 100%);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: white;
            font-weight: bold;
        }
        
        .profile-name {
            font-size: 24px;
            font-weight: 600;
            color: #575757;
            margin-bottom: 5px;
        }
        
        .profile-email {
            font-size: 16px;
            color: #888888;
            margin-bottom: 20px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: #F6A103;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 14px;
            color: #888888;
        }
        
        .profile-form {
            background: white;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .form-title {
            font-size: 18px;
            font-weight: 600;
            color: #575757;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #D9D9D9;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #575757;
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #D9D9D9;
            border-radius: 8px;
            font-size: 16px;
            color: #575757;
            background: white;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #F6A103;
        }
        
        .form-input:disabled {
            background: #f5f5f5;
            color: #888888;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #F6A103;
            color: white;
        }
        
        .btn-primary:hover {
            background: #e59200;
        }
        
        .btn-secondary {
            background: #888888;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #777777;
        }
        
        .btn-danger {
            background: #f44336;
            color: white;
        }
        
        .btn-danger:hover {
            background: #d32f2f;
        }
        
        .logout-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #888888;
        }
        
        .account-created {
            font-size: 14px;
            color: #888888;
            text-align: center;
            margin-top: 20px;
        }
        
        .message {
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        
        .message.success {
            background: #4CAF50;
            color: white;
            display: block;
        }
        
        .message.error {
            background: #f44336;
            color: white;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Левая панель с иконками -->
        <div class="sidebar">
            <a href="dashboard.html" class="nav-icon">
                <i class="fas fa-home"></i>
            </a>
            <a href="us.html" class="nav-icon">
                <i class="fas fa-info-circle"></i>
            </a>
            <div class="nav-icon active">
                <i class="fas fa-user"></i>
            </div>
        </div>
        
        <!-- Основной контент -->
        <div class="main-content">
            <a href="dashboard.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                Назад к главной
            </a>
            
            <div class="profile-header">
                <div class="logo">S84.<span>TODO</span></div>
                <h1 class="profile-title">Мой профиль</h1>
            </div>
            
            <div class="profile-content">
                <div id="message" class="message"></div>
                
                <div class="profile-info">
                    <div class="profile-avatar" id="profileAvatar">СИ</div>
                    <div class="profile-name" id="profileName">Студент Иванов</div>
                    <div class="profile-email" id="profileEmail">student@s84.ru</div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="disciplinesCount">0</div>
                        <div class="stat-label">дисциплин</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="tasksCount">0</div>
                        <div class="stat-label">заданий</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="completedCount">0</div>
                        <div class="stat-label">выполнено</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="progressPercent">0%</div>
                        <div class="stat-label">общий прогресс</div>
                    </div>
                </div>
                
                <div class="profile-form">
                    <div class="form-title">Основная информация</div>
                    
                    <div class="form-group">
                        <label class="form-label">Логин</label>
                        <input type="text" class="form-input" id="usernameInput" disabled>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-input" id="emailInput">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Дата регистрации</label>
                        <input type="text" class="form-input" id="regDateInput" disabled>
                    </div>
                    
                    <div class="btn-group">
                        <button class="btn btn-secondary" id="cancelBtn">Отмена</button>
                        <button class="btn btn-primary" id="saveBtn">Сохранить изменения</button>
                    </div>
                </div>
                
                <div class="profile-form">
                    <div class="form-title">Смена пароля</div>
                    
                    <div class="form-group">
                        <label class="form-label">Текущий пароль</label>
                        <input type="password" class="form-input" id="currentPassword">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Новый пароль</label>
                        <input type="password" class="form-input" id="newPassword">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Повторите новый пароль</label>
                        <input type="password" class="form-input" id="confirmPassword">
                    </div>
                    
                    <button class="btn btn-primary" id="changePasswordBtn" style="width: 100%; margin-top: 10px;">
                        Сменить пароль
                    </button>
                </div>
                
                <div class="logout-section">
                    <button class="btn btn-danger" id="logoutBtn" style="width: 100%;">
                        <i class="fas fa-sign-out-alt"></i> Выйти из профиля
                    </button>
                    
                    <div class="account-created" id="accountCreated">
                        Аккаунт создан: 15 января 2026
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/scripts.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Загружаем данные профиля
            loadProfileData();
            
            // Инициализируем обработчики событий
            initEventHandlers();
        });
        
        // Загрузка данных профиля
        function loadProfileData() {
            const currentUser = S84.loadUserData();
            
            if (!currentUser) {
                // Если нет пользователя, создаем демо-данные
                const demoUser = {
                    username: 'student',
                    email: 'student@s84.todo',
                    createdAt: new Date().toISOString(),
                    disciplines: []
                };
                
                sessionStorage.setItem('s84_current_user', JSON.stringify(demoUser));
                
                // Обновляем интерфейс с демо-данными
                updateProfileUI(demoUser);
                updateStats(demoUser);
            } else {
                // Обновляем интерфейс с реальными данными
                updateProfileUI(currentUser);
                updateStats(currentUser);
            }
        }
        
        // Обновление интерфейса профиля
        function updateProfileUI(user) {
            document.getElementById('profileAvatar').textContent = 
                user.username ? user.username.substring(0, 2).toUpperCase() : 'СИ';
            document.getElementById('profileName').textContent = user.username || 'Студент';
            document.getElementById('profileEmail').textContent = user.email || `${user.username}@s84.todo`;
            document.getElementById('usernameInput').value = user.username || '';
            document.getElementById('emailInput').value = user.email || `${user.username}@s84.todo`;
            
            // Дата регистрации
            const regDate = user.createdAt ? new Date(user.createdAt) : new Date();
            document.getElementById('regDateInput').value = 
                regDate.toLocaleDateString('ru-RU', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
            
            // Дата создания аккаунта
            document.getElementById('accountCreated').textContent = 
                `Аккаунт создан: ${regDate.toLocaleDateString('ru-RU', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                })}`;
        }
        
        // Обновление статистики
        function updateStats(user) {
            const stats = S84.calculateUserStats(user);
            
            document.getElementById('disciplinesCount').textContent = stats.disciplinesCount;
            document.getElementById('tasksCount').textContent = stats.tasksCount;
            document.getElementById('completedCount').textContent = stats.completedCount;
            document.getElementById('progressPercent').textContent = `${stats.progressPercent}%`;
        }
        
        // Инициализация обработчиков событий
        function initEventHandlers() {
            // Кнопка сохранения изменений
            document.getElementById('saveBtn').addEventListener('click', function() {
                saveProfileChanges();
            });
            
            // Кнопка отмены
            document.getElementById('cancelBtn').addEventListener('click', function() {
                const currentUser = S84.loadUserData();
                if (currentUser) {
                    updateProfileUI(currentUser);
                    showMessage('Изменения отменены', 'success');
                }
            });
            
            // Смена пароля
            document.getElementById('changePasswordBtn').addEventListener('click', function() {
                changePassword();
            });
            
            // Выход из профиля
            document.getElementById('logoutBtn').addEventListener('click', function() {
                S84.logoutUser();
                window.location.href = 'index.html';
            });
        }
        
        // Сохранение изменений профиля
        function saveProfileChanges() {
            const newEmail = document.getElementById('emailInput').value.trim();
            const currentUser = S84.loadUserData();
            
            if (!currentUser) {
                showMessage('Пользователь не найден', 'error');
                return;
            }
            
            if (!newEmail || !newEmail.includes('@') || !newEmail.includes('.')) {
                showMessage('Введите корректный email адрес', 'error');
                return;
            }
            
            // Обновляем email
            const success = S84.updateUserEmail(currentUser, newEmail);
            
            if (success) {
                showMessage('Изменения сохранены успешно!', 'success');
                updateProfileUI(currentUser);
            } else {
                showMessage('Ошибка при сохранении изменений', 'error');
            }
        }
        
        // Смена пароля
        function changePassword() {
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const currentUser = S84.loadUserData();
            
            if (!currentUser) {
                showMessage('Пользователь не найден', 'error');
                return;
            }
            
            // Валидация
            if (!currentPassword) {
                showMessage('Введите текущий пароль', 'error');
                return;
            }
            
            if (!newPassword) {
                showMessage('Введите новый пароль', 'error');
                return;
            }
            
            if (newPassword.length < 8) {
                showMessage('Новый пароль должен содержать минимум 8 символов', 'error');
                return;
            }
            
            if (!/[a-zA-Zа-яА-Я]/.test(newPassword)) {
                showMessage('Новый пароль должен содержать хотя бы одну букву', 'error');
                return;
            }
            
            if (!/\d/.test(newPassword)) {
                showMessage('Новый пароль должен содержать хотя бы одну цифру', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('Новые пароли не совпадают', 'error');
                return;
            }
            
            // Меняем пароль
            const result = S84.changeUserPassword(currentUser, currentPassword, newPassword);
            
            if (result.success) {
                showMessage(result.message, 'success');
                
                // Очищаем поля
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
            } else {
                showMessage(result.message, 'error');
            }
        }
        
        // Показать сообщение
        function showMessage(text, type) {
            const messageElement = document.getElementById('message');
            messageElement.textContent = text;
            messageElement.className = `message ${type}`;
            
            // Автоматически скрыть сообщение через 5 секунд
            setTimeout(() => {
                messageElement.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
